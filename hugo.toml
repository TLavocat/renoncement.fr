baseURL = "https://renoncement.fr/"
locale = "fr-FR"
defaultContentLanguage = "fr"
title = "renoncement.fr"
theme = "PaperMod"
timeZone = "Europe/Paris"
enableRobotsTXT = true

[pagination]
pagerSize = 10

[params]
description = "Récits de renoncement partagés par la communauté du vol libre. Renoncer à un vol n'est jamais un échec."
defaultTheme = "auto"
ShowReadingTime = false
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = false
ShowRssButtonInSectionTermList = true
hideFooter = false
comments = true
mainSections = ["rex"]

[params.label]
text = "Trophée du renoncement"

[params.assets]
favicon = "/favicon.svg"

[params.homeInfoParams]
Title = "Renoncer, c'est aussi piloter"
Content = """
Dans le vol libre, décider de ne pas voler est important, parfois vital. Ça fait partie de l'activité, mais ce n'est jamais récompensé.

Ce site existe pour inverser ça. Partage ton récit de renoncement : le contexte, les signaux faibles, le déclencheur. Chaque récit, publié anonymement, aide tous les pilotes à reconnaître les pièges météo ou psychologiques, et dédramatise le fait de ne pas voler.

Et chaque année, le **[Trophée du renoncement](/reglement/#3-tirage-au-sort)** : un tirage au sort parmi les récits publiés (ce n'est pas un concours, [c'est voulu](/faq/)) offre une journée de stage SIV. Une bonne décision au sol, récompensée par de la sécurité active en l'air.
"""

# giscus (comments). Leave repoID/categoryID empty until set up — the comments
# partial renders nothing while repoID is empty. See SETUP.md, step G.
[params.giscus]
repo = "TLavocat/renoncement.fr"
repoID = "R_kgDOTpXgJQ"
category = "Commentaires"
categoryID = "DIC_kwDOTpXgJc4DCeaD"

[menus]
[[menus.main]]
name = "Accueil"
url = "/"
weight = 10
[[menus.main]]
name = "Tous les REX"
url = "/rex/"
weight = 20
[[menus.main]]
name = "Règlement"
url = "/reglement/"
weight = 30
[[menus.main]]
name = "FAQ"
url = "/faq/"
weight = 35
[[menus.main]]
name = "Mentions légales"
url = "/mentions-legales/"
weight = 40
[[menus.main]]
name = "Partager mon REX"
url = "https://docs.google.com/forms/d/e/1FAIpQLSeZn_A5D5QuS-GSy1GMj1vY4FjD_dC77rbGJZ6_91ig134hng/viewform"
weight = 50

[markup.goldmark.renderer]
# Raw HTML in markdown is stripped. REX pages are generated from public form
# submissions — flipping this to true would allow HTML/JS injection on the site.
unsafe = false
