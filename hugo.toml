baseURL = "https://renoncement.fr/"
locale = "fr-FR"
defaultContentLanguage = "fr"
title = "renoncement.fr"
theme = "PaperMod"
timeZone = "Europe/Paris"
enableRobotsTXT = true

[pagination]
pagerSize = 10

[params]
description = "Récits de renoncement partagés par la communauté du vol libre. Renoncer à un vol n'est jamais un échec."
defaultTheme = "auto"
ShowReadingTime = false
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = false
ShowRssButtonInSectionTermList = true
hideFooter = false
comments = true
mainSections = ["rex"]
images = ["/img/og.jpg"]

[params.label]
text = "Trophée du renoncement"

[params.footer]
text = "site libre : [code source](https://github.com/TLavocat/renoncement.fr)"

[params.assets]
favicon = "/favicon.svg"

[params.homeInfoParams]
Title = "Renoncer, c'est aussi piloter"
Content = """
Dans le vol libre, décider de ne pas voler est important, parfois vital. Ça fait partie de l'activité, mais ce n'est jamais récompensé.

Ce site existe pour inverser ça. Partage ton récit de renoncement : le contexte, les signaux faibles, le déclencheur. Chaque récit, publié anonymement, aide tous les pilotes à reconnaître les pièges météo ou psychologiques, et dédramatise le fait de ne pas voler.

Et chaque année, le **[Trophée du renoncement](/reglement/#3-tirage-au-sort)** : un tirage au sort parmi les récits publiés (ce n'est pas un concours, [c'est voulu](/faq/)) offre une journée de stage SIV. Une bonne décision au sol, récompensée par de la sécurité active en l'air.
"""

# Moderation report link, rendered in each REX page's meta block
# (layouts/single.html). Empty entryId = identifiant shown without a link.
[params.rexReport]
formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSet36j_pft9KbgyV9Jikts3eZeAvBRLKenrGkeaBK1XU0Vk0Q/viewform"
entryId = "entry.1217368245"

# Decorative photo strips inserted after every 3rd entry in list pages.
[[params.listStrips]]
src = "/img/strip-falaise.jpg"
alt = "Ailes de parapente en vol le long d'une falaise"
[[params.listStrips]]
src = "/img/strip-orage.jpg"
alt = "Enclume de cumulonimbus à l'horizon derrière une crête de Chartreuse"
[[params.listStrips]]
src = "/img/strip-coucher.jpg"
alt = "Coucher de soleil sur une mer de nuages en montagne"

# giscus (comments). Leave repoID/categoryID empty until set up — the comments
# partial renders nothing while repoID is empty. See SETUP.md, step G.
[params.giscus]
repo = "TLavocat/renoncement.fr"
repoID = "R_kgDOTpXgJQ"
category = "Commentaires"
categoryID = "DIC_kwDOTpXgJc4DCeaD"

[menus]
[[menus.main]]
name = "Accueil"
url = "/"
weight = 10
[[menus.main]]
name = "Tous les REX"
url = "/archives/"
weight = 20
[[menus.main]]
name = "Règlement"
url = "/reglement/"
weight = 30
[[menus.main]]
name = "FAQ"
url = "/faq/"
weight = 35
[[menus.main]]
name = "Mentions légales"
url = "/mentions-legales/"
weight = 40
[[menus.main]]
name = "Partager mon REX"
url = "https://docs.google.com/forms/d/e/1FAIpQLSeZn_A5D5QuS-GSy1GMj1vY4FjD_dC77rbGJZ6_91ig134hng/viewform"
weight = 50

[markup.goldmark.renderer]
# Raw HTML in markdown is stripped. REX pages are generated from public form
# submissions — flipping this to true would allow HTML/JS injection on the site.
unsafe = false

[markup.goldmark.extensions]
# No auto-linking of bare URLs: user text is markdown-escaped by sync.py, and
# linkify would still turn pasted URLs into live links behind its back.
linkify = false
