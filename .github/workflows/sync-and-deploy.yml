# Stateless content pipeline: the Google Sheet is the source of truth. Every
# run regenerates content/rex/ in the workspace, builds, and deploys — nothing
# is ever committed back, so the workflow needs no write access to the repo
# and branch protection needs no bypass. REX never enter git history.
name: Sync and deploy

on:
  schedule:
    # Two slots per hour: GitHub's scheduler is best-effort and sheds cron
    # slots under load (observed >50% drop rate) — doubling the attempts
    # halves the average publication delay when slots are skipped.
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

env:
  GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Sync REX from Google Sheet
        if: env.GOOGLE_SHEET_ID != ''
        run: python scripts/sync.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build site
        run: hugo --minify --gc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
