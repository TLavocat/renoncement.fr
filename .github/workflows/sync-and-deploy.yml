# Single workflow on purpose: pushes made with GITHUB_TOKEN never trigger other
# workflows, so a separate on:push deploy workflow would never fire after the
# sync commit. Sync steps are skipped until the Google secrets exist (SETUP.md).
name: Sync and deploy

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

env:
  GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Sync REX from Google Sheet
        if: env.GOOGLE_SHEET_ID != ''
        run: python scripts/sync.py

      - name: Commit and push content changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/rex
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync REX from sheet"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keepalive against 60-day schedule auto-disable
        if: github.event_name == 'schedule' && steps.commit.outputs.changed == 'false'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 24 * 3600 )) ]; then
            git commit --allow-empty -m "chore: keepalive"
            git push
          fi

      # Build and deploy — skipped on scheduled runs that changed nothing.
      - name: Setup Hugo
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Configure Pages
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build site
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
        run: hugo --minify --gc

      - name: Upload Pages artifact
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deploy
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v5
